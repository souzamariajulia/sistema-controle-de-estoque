<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar Entrada</title>
    <link rel="icon" type="image/png" href="img/icone-alucom.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>

    <main>
      <section>
        <h2>Registrar entrada</h2>
        <nav class="breadcrumb">
          <a href="entradas.html">Entradas</a>
          <span>/</span>
          <span class="breadcrumb-atual">Registrar entrada</span>
        </nav>

        <form id="form-movimentacao">
          <label>
            Data
            <input type="date" name="data" required />
          </label>
          <label>
            Número da nota
            <input type="text" name="numero_nota" maxlength="50" required />
          </label>
          <label>
            Fornecedor
            <input type="text" name="fornecedor" maxlength="150" required />
          </label>

          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="linhas-itens"></tbody>
          </table>

          <div class="acoes-form">
            <button type="button" id="btn-add-linha" class="secundario">
              + Adicionar item
            </button>
            <button type="submit">Registrar entrada</button>
            <a class="botao-secundario" href="entradas.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/movimentacao-form.js"></script>
    <script src="js/entrada-nova.js"></script>
  </body>
</html>
