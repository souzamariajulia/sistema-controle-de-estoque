<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saídas de Estoque</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="itens.html">Itens</a>
        <a href="entradas.html">Entradas</a>
        <a href="saidas.html">Saídas</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Registrar saída</h2>

        <div id="mensagem" class="mensagem" hidden></div>

        <form id="form-movimentacao">
          <label>
            Data
            <input type="date" name="data" required />
          </label>
          <label>
            Número de controle
            <input type="text" name="numero_controle" maxlength="50" required />
          </label>
          <label>
            Local/destino
            <input type="text" name="local_destino" maxlength="150" required />
          </label>

          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="linhas-itens"></tbody>
          </table>

          <div class="acoes-form">
            <button type="button" id="btn-add-linha" class="secundario">
              + Adicionar item
            </button>
            <button type="submit">Registrar saída</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Consultar saídas por item</h2>

        <div class="linha-consulta">
          <div>
            <label>
              Item
              <select id="select-consulta-item"></select>
            </label>
          </div>
          <button type="button" id="btn-consultar">Consultar</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Nº controle</th>
              <th>Local/destino</th>
              <th>Quantidade</th>
            </tr>
          </thead>
          <tbody id="linhas-consulta"></tbody>
        </table>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/movimentacao.js"></script>
    <script src="js/saidas.js"></script>
  </body>
</html>
