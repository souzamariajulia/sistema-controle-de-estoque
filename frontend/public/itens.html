<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Itens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>

    <main>
      <section>
        <div class="cabecalho-secao">
          <h2>Itens cadastrados</h2>
          <a class="botao" href="item-novo.html">+ Cadastrar item</a>
        </div>

        <div class="linha-consulta">
          <div>
            <label>
              Buscar por descrição
              <input type="search" id="input-busca" placeholder="ex: caneta" />
            </label>
          </div>
          <button type="button" id="btn-buscar">Buscar</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Cadastrado por</th>
              <th>Categoria</th>
              <th>Subcategoria</th>
              <th>Estoque</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="linhas-itens"></tbody>
        </table>
      </section>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/itens.js"></script>
  </body>
</html>
