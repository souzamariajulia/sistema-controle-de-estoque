<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relatório de Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>

    <main>
      <section>
        <h2>Relatório de estoque</h2>

        <div class="filtros-relatorio">
          <label>
            Item
            <select id="filtro-item">
              <option value="">Todos os itens</option>
            </select>
          </label>
          <label>
            Data inicial
            <input type="date" id="filtro-data-inicio" />
          </label>
          <label>
            Data final
            <input type="date" id="filtro-data-fim" />
          </label>
          <div>
            <button type="button" id="btn-gerar">Gerar relatório</button>
          </div>
          <div class="filtros-relatorio-exportar">
            <button type="button" id="btn-exportar" class="secundario">
              Exportar .xlsx
            </button>
            <button type="button" id="btn-imprimir" class="secundario">
              Imprimir
            </button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Categoria</th>
              <th>Subcategoria</th>
              <th>Cadastrado por</th>
              <th>Estoque atual</th>
              <th>Total entradas</th>
              <th>Total saídas</th>
              <th>Saldo movimentado</th>
            </tr>
          </thead>
          <tbody id="linhas-relatorio"></tbody>
        </table>
      </section>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/relatorio.js"></script>
  </body>
</html>
