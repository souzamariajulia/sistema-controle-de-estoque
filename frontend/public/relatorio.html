<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatório de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="itens.html">Itens</a>
            <a href="entradas.html">Entradas</a>
            <a href="saidas.html">Saídas</a>
            <a href="relatorio.html">Relatório</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Relatório de estoque</h2>

            <div id="mensagem" class="mensagem" hidden></div>

            <div class="filtros-relatorio">
                <label>
                    Item
                    <select id="filtro-item">
                        <option value="">Todos os itens</option>
                    </select>
                </label>
                <label>
                    Data inicial
                    <input type="date" id="filtro-data-inicio">
                </label>
                <label>
                    Data final
                    <input type="date" id="filtro-data-fim">
                </label>
            </div>

            <div class="acoes-form">
                <button type="button" id="btn-gerar">Gerar relatório</button>
                <button type="button" id="btn-exportar" class="secundario">Exportar .xlsx</button>
                <button type="button" id="btn-imprimir" class="secundario">Imprimir</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Categoria</th>
                        <th>Subcategoria</th>
                        <th>Cadastrado por</th>
                        <th>Estoque atual</th>
                        <th>Total entradas</th>
                        <th>Total saídas</th>
                        <th>Saldo movimentado</th>
                    </tr>
                </thead>
                <tbody id="linhas-relatorio"></tbody>
            </table>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/relatorio.js"></script>
</body>
</html>
