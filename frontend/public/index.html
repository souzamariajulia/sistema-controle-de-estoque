<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Início</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>

    <main>
      <section class="hero-inicio">
        <img src="img/logo-alucom.png" alt="ALUCOM" class="logo-inicio" />
        <h2>Sistema de Controle de Estoque</h2>
        <p>Gerencie itens, entradas, saídas e relatórios em um só lugar.</p>
      </section>

      <section>
        <h2>Resumo</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-valor" id="stat-total-itens">–</span>
            <span class="stat-rotulo">Itens cadastrados</span>
          </div>
          <div class="stat-card">
            <span class="stat-valor" id="stat-estoque-total">–</span>
            <span class="stat-rotulo">Unidades em estoque</span>
          </div>
          <div class="stat-card">
            <span class="stat-valor" id="stat-categorias">–</span>
            <span class="stat-rotulo">Categorias</span>
          </div>
        </div>
      </section>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/inicio.js"></script>
  </body>
</html>
