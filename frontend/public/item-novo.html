<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastrar Item</title>
    <link rel="icon" type="image/png" href="img/icone-alucom.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>

    <main>
      <section>
        <h2>Cadastrar item</h2>
        <nav class="breadcrumb">
          <a href="itens.html">Itens</a>
          <span>/</span>
          <span class="breadcrumb-atual">Cadastrar item</span>
        </nav>

        <form id="form-cadastro-item">
          <label>
            Descrição
            <input type="text" name="descricao" maxlength="255" required />
          </label>
          <label>
            Subcategoria
            <select
              name="subcategoria_id"
              id="select-subcategoria"
              required
            ></select>
          </label>
          <label>
            Cadastrado por
            <input type="text" name="cadastrado_por" maxlength="150" required />
          </label>
          <label>
            Estoque inicial
            <input type="number" name="estoque" min="0" step="1" value="0" />
          </label>

          <div class="acoes-form">
            <button type="submit">Cadastrar item</button>
            <a class="botao-secundario" href="itens.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/item-novo.js"></script>
  </body>
</html>
